<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d18">
  <meta name="description" content="Mabel AI — دستیار هوشمند با هویت اختصاصی">
  <title>چت آنلاین | Mabel AI</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    :root {
      --mabel-purple: #a78bfa;
      --mabel-light: #ddd0ff;
      --mabel-deep: #7c3aed;
      --mabel-border: rgba(196, 181, 253, .16);
      --mabel-glass: rgba(24, 17, 40, .68);
      --mabel-muted: #9588a9;
    }

    * {
      box-sizing: border-box;
    }

    body.chat-page {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 75% 5%, rgba(124, 58, 237, .10), transparent 38%),
        radial-gradient(ellipse at 5% 90%, rgba(167, 139, 250, .06), transparent 35%),
        var(--bg);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    /* هویت اختصاصی Mabel AI */
    .mabel-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      border-radius: 13px;
      background: linear-gradient(
        145deg,
        rgba(167, 139, 250, .16),
        rgba(124, 58, 237, .035)
      );
      border: 1px solid var(--mabel-border);
      box-shadow:
        0 5px 20px rgba(124, 58, 237, .10),
        inset 0 1px 0 rgba(255, 255, 255, .07);
    }

    .mabel-mark svg {
      display: block;
      width: 28px;
      height: 28px;
      overflow: visible;
      filter: drop-shadow(0 2px 6px rgba(139, 92, 246, .35));
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand .brand-name {
      letter-spacing: .3px;
    }

    .chat-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .chat-brand .mabel-mark {
      width: 35px;
      height: 35px;
      border-radius: 12px;
    }

    .chat-brand .mabel-mark svg {
      width: 25px;
      height: 25px;
    }

    .chat-brand-text {
      display: inline-flex;
      flex-direction: column;
      gap: 4px;
    }

    .chat-brand-text b {
      color: #eee7ff;
      font-size: 15px;
      letter-spacing: .2px;
    }

    .chat-brand-text small {
      color: var(--mabel-purple);
      font-size: 11px;
      font-weight: 600;
    }

    /* نوار بالایی */
    body.chat-page .nav {
      border-bottom: 1px solid rgba(196, 181, 253, .10);
      background: rgba(16, 13, 24, .74);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    /* چیدمان اصلی */
    .chat-layout {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 24px;
      gap: 20px;
      align-items: stretch;
    }

    /* پنل تاریخچه */
    .chat-side {
      min-width: 0;
      border: 1px solid var(--mabel-border);
      border-radius: 20px;
      padding: 17px;
      background: var(--mabel-glass);
      box-shadow:
        0 15px 40px rgba(0, 0, 0, .12),
        inset 0 1px 0 rgba(255, 255, 255, .035);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .chat-side > small {
      display: block;
      margin: 21px 2px 12px;
      color: var(--mabel-muted);
      font-size: 11px;
      letter-spacing: .2px;
    }

    .chat-side .full {
      width: 100%;
      min-height: 43px;
      border-radius: 12px;
      border: 1px solid rgba(167, 139, 250, .22);
      background: linear-gradient(
        135deg,
        rgba(139, 92, 246, .19),
        rgba(124, 58, 237, .07)
      );
      transition: border-color .2s ease, background .2s ease;
    }

    .chat-side .full:hover {
      border-color: rgba(167, 139, 250, .45);
      background: rgba(139, 92, 246, .18);
    }

    .chat-side .search {
      width: 100%;
      margin-top: 13px;
      border-radius: 11px;
      border: 1px solid rgba(196, 181, 253, .12);
      background: rgba(9, 7, 16, .28);
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    .chat-side .search:focus {
      outline: none;
      border-color: rgba(167, 139, 250, .4);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, .06);
    }

    #history {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    #history > * {
      max-width: 100%;
      border-radius: 10px;
    }

    /* کادر اصلی چت */
    .chatbox {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: min(76vh, 820px);
      overflow: hidden;
      border: 1px solid rgba(190, 160, 255, .17);
      border-radius: 22px;
      background: rgba(22, 17, 33, .82);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, .20),
        0 0 30px rgba(124, 58, 237, .045),
        inset 0 1px 0 rgba(255, 255, 255, .035);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .chat-head {
      min-height: 70px;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(190, 160, 255, .11);
      background: rgba(255, 255, 255, .012);
    }

    .chat-head .ghost {
      flex: 0 0 auto;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(196, 181, 253, .12);
      background: rgba(255, 255, 255, .025);
      color: #b8abc9;
      font-size: 12px;
      transition: .2s ease;
    }

    .chat-head .ghost:hover {
      border-color: rgba(167, 139, 250, .35);
      background: rgba(139, 92, 246, .09);
      color: #eee7ff;
    }

    /* فضای پیام‌ها */
    .messages {
      flex: 1;
      min-height: 260px;
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(167, 139, 250, .30) transparent;
    }

    .messages::-webkit-scrollbar {
      width: 5px;
    }

    .messages::-webkit-scrollbar-thumb {
      border-radius: 10px;
      background: rgba(167, 139, 250, .26);
    }

    /* حباب پیام‌ها */
    .messages > * {
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .messages img {
      max-width: 100%;
      height: auto;
    }

    .messages pre {
      max-width: 100%;
      overflow-x: auto;
      border: 1px solid rgba(196, 181, 253, .12);
      border-radius: 12px;
    }

    .messages code {
      overflow-wrap: anywhere;
    }

    .typing {
      padding: 0 22px 10px;
      color: #b9a0ff;
      font-size: 11px;
      letter-spacing: 3px;
    }

    /* نوار نوشتن */
    .composer {
      position: relative;
      flex: 0 0 auto;
      margin: 12px 14px 14px;
      padding: 12px 14px 10px;
      border: 1px solid rgba(190, 160, 255, .18);
      border-radius: 19px;
      background: rgba(13, 10, 21, .74);
      box-shadow:
        0 8px 30px rgba(0, 0, 0, .12),
        inset 0 1px 0 rgba(255, 255, 255, .025);
      transition: border-color .2s ease, box-shadow .2s ease;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .composer:focus-within {
      border-color: rgba(167, 139, 250, .42);
      box-shadow:
        0 0 0 3px rgba(139, 92, 246, .055),
        0 8px 30px rgba(0, 0, 0, .12);
    }

    .file-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 0 8px;
    }

    /* دکمه کوچک انتخاب فایل */
    .add-file-btn {
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      padding: 0;
      border-radius: 10px;
      border: 1px solid rgba(167, 139, 250, .32);
      background: linear-gradient(
        145deg,
        rgba(167, 139, 250, .15),
        rgba(124, 58, 237, .06)
      );
      color: #c4b5fd;
      font-size: 21px;
      font-weight: 400;
      line-height: 1;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease;
    }

    .add-file-btn:hover {
      transform: translateY(-1px);
      background: rgba(139, 92, 246, .22);
    }

    .add-file-btn:active {
      transform: scale(.94);
    }

    .add-file-btn:focus-visible,
    .send:focus-visible {
      outline: 2px solid var(--mabel-light);
      outline-offset: 3px;
    }

    .composer textarea {
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 42px;
      max-height: 200px;
      padding: 10px 5px;
      resize: vertical;
      border: 0;
      outline: 0;
      background: transparent;
      color: #f1eaff;
      font: inherit;
      font-size: 14px;
      line-height: 1.9;
    }

    .composer textarea::placeholder {
      color: #81758f;
    }

    .composer textarea:focus {
      outline: none;
    }

    /* دکمه ارسال */
    .send {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, .10);
      background: linear-gradient(145deg, #a78bfa, #7c3aed);
      color: #fff;
      box-shadow: 0 3px 14px rgba(124, 58, 237, .20);
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .send:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 20px rgba(124, 58, 237, .30);
    }

    .send:active {
      transform: scale(.96);
    }

    .hint {
      padding: 6px 4px 0;
      color: #8f829f;
      font-size: 10px;
      line-height: 1.8;
    }

    /* نمایش فایل انتخاب‌شده */
    .file-status {
      display: none;
      align-items: center;
      gap: 9px;
      margin: 0 14px 8px;
      padding: 9px 11px;
      border: 1px solid rgba(167, 139, 250, .22);
      border-radius: 12px;
      background: rgba(139, 92, 246, .08);
      color: #d9ccff;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .file-status.visible {
      display: flex;
    }

    .file-status-name {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
    }

    .remove-file-btn {
      flex: 0 0 auto;
      padding: 4px 8px;
      border: 1px solid rgba(248, 113, 113, .25);
      border-radius: 8px;
      background: rgba(248, 113, 113, .07);
      color: #fca5a5;
      cursor: pointer;
    }

    .remove-file-btn:hover {
      background: rgba(248, 113, 113, .15);
    }

    /* سازگاری با تم روشن */
    body:not(.dark).chat-page {
      --mabel-glass: rgba(255, 255, 255, .78);
      --mabel-border: rgba(124, 58, 237, .14);
    }

    body:not(.dark).chat-page .chatbox,
    body:not(.dark).chat-page .chat-side {
      background: rgba(255, 255, 255, .78);
      box-shadow:
        0 16px 45px rgba(50, 30, 80, .07),
        inset 0 1px 0 rgba(255, 255, 255, .7);
    }

    body:not(.dark).chat-page .chat-brand-text b {
      color: #302343;
    }

    body:not(.dark).chat-page .composer {
      background: rgba(255, 255, 255, .86);
    }

    body:not(.dark).chat-page .composer textarea {
      color: #302343;
    }

    body:not(.dark).chat-page .composer textarea::placeholder {
      color: #9588a9;
    }

    body:not(.dark).chat-page .chat-head .ghost {
      color: #68577f;
    }

    body:not(.dark).chat-page .file-status {
      color: #5b3c8c;
    }

    /* نمایشگرهای کوچک */
    @media (max-width: 900px) {
      .chat-layout {
        padding: 16px;
        gap: 14px;
      }

      .chatbox {
        min-height: 72vh;
      }

      .chat-side {
        padding: 13px;
      }
    }

    @media (max-width: 600px) {
      .chat-layout {
        padding: 10px;
        gap: 10px;
      }

      .chatbox {
        min-height: 72vh;
        border-radius: 17px;
      }

      .chat-head {
        min-height: 62px;
        padding: 12px;
      }

      .chat-brand .mabel-mark {
        width: 32px;
        height: 32px;
      }

      .chat-brand .mabel-mark svg {
        width: 23px;
        height: 23px;
      }

      .chat-brand-text b {
        font-size: 14px;
      }

      .messages {
        padding: 16px 12px;
        gap: 13px;
      }

      .composer {
        margin: 8px;
        padding: 9px 11px;
        border-radius: 15px;
      }

      .file-status {
        margin-right: 8px;
        margin-left: 8px;
      }

      .typing {
        padding-right: 14px;
        padding-left: 14px;
      }

      .chat-head .ghost {
        padding: 7px 9px;
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body class="chat-page">

<!-- نماد ماه اختصاصی؛ بدون تصویر خارجی -->
<svg xmlns="http://www.w3.org/2000/svg"
     width="0" height="0"
     aria-hidden="true"
     style="position:absolute;overflow:hidden">
  <symbol id="mabel-moon" viewBox="0 0 100 100">
    <defs>
      <linearGradient id="mabel-moon-gradient"
                      x1="15" y1="10" x2="85" y2="90"
                      gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#e9ddff"/>
        <stop offset="48%" stop-color="#a78bfa"/>
        <stop offset="100%" stop-color="#7c3aed"/>
      </linearGradient>
    </defs>
    <path
      d="M69 11
         C43 10 22 29 22 52
         C22 74 39 90 59 88
         C72 87 83 79 89 66
         C78 73 63 72 52 63
         C39 52 38 34 48 22
         C54 16 61 13 69 11 Z"
      fill="url(#mabel-moon-gradient)"
    />
  </symbol>
</svg>

<header class="nav">
  <a class="brand" href="index.html" aria-label="صفحه خانه Mabel AI">
    <span class="mabel-mark" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <use href="#mabel-moon"/>
      </svg>
    </span>
    <b class="brand-name">Mabel AI</b>
  </a>

  <nav aria-label="منوی اصلی">
    <a href="index.html">خانه</a>
    <a class="active" href="chat.html">چت</a>
    <a href="features.html">امکانات</a>
  </nav>

  <div class="nav-actions">
    <button class="theme"
            type="button"
            onclick="toggleTheme()"
            aria-label="تغییر تم">◐</button>
    <span class="pill">ONLINE AI</span>
  </div>
</header>

<div class="chat-layout">

  <aside class="chat-side">
    <button class="btn full" type="button" onclick="newChat()">
      ＋ گفتگوی جدید
    </button>

    <input
      id="chatSearch"
      class="search"
      type="search"
      placeholder="جست‌وجو..."
      aria-label="جست‌وجوی گفتگوها"
      oninput="renderHistory()"
    >

    <small>گفتگوهای اخیر</small>
    <div id="history"></div>

    <div style="margin-top:20px;padding:12px;background:var(--soft);border-radius:12px;font-size:10px;color:var(--muted);line-height:2">
      🔐 کلید API روی سرور نگه‌داری می‌شود و داخل مرورگر قرار نمی‌گیرد.
    </div>
  </aside>

  <section class="chatbox" aria-label="گفتگوی Mabel AI">

    <div class="chat-head">
      <div class="chat-brand">
        <span class="mabel-mark" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <use href="#mabel-moon"/>
          </svg>
        </span>

        <span class="chat-brand-text">
          <b>Mabel AI</b>
          <small>● آنلاین</small>
        </span>
      </div>

      <button class="ghost" type="button" onclick="clearCurrent()">
        پاک کردن
      </button>
    </div>

    <div class="messages" id="messages" aria-live="polite"></div>

    <div id="typing" class="typing" aria-label="در حال پاسخ‌گویی">
      ● ● ●
    </div>

    <div
      id="fileStatus"
      class="file-status"
      role="status"
      aria-live="polite"
    >
      <span aria-hidden="true">📄</span>
      <span id="fileStatusName" class="file-status-name"></span>
      <button
        class="remove-file-btn"
        type="button"
        onclick="removeSelectedFile()"
        aria-label="حذف فایل انتخاب‌شده"
      >حذف ×</button>
    </div>

    <div class="composer">
      <input
        id="fileInput"
        type="file"
        accept=".pdf,.txt,.md,.csv,.json,.js,.html,.css,.py,.ts,.jsx,.tsx,.xml"
        style="display:none"
        onchange="showSelectedFile()"
      >

      <div class="file-tools">
        <button
          type="button"
          class="add-file-btn"
          onclick="document.getElementById('fileInput').click()"
          aria-label="انتخاب فایل"
          title="انتخاب فایل"
        >＋</button>
      </div>

      <textarea
        id="input"
        rows="1"
        placeholder="پیامت را بنویس..."
        aria-label="متن پیام"
      ></textarea>

      <button
        class="send"
        id="sendButton"
        type="button"
        onclick="sendMessage()"
        aria-label="ارسال پیام"
      >➤</button>

      <div class="hint">
        Enter برای ارسال • Shift + Enter خط جدید
      </div>
    </div>
  </section>
</div>

<script>
  // انتخاب فایل فقط نام آن را نمایش می‌دهد؛ محتوای فایل خوانده نمی‌شود.
  function showSelectedFile() {
    const input = document.getElementById("fileInput");
    const status = document.getElementById("fileStatus");
    const name = document.getElementById("fileStatusName");

    if (!input || !status || !name) return;

    const file = input.files && input.files[0];

    if (!file) {
      status.classList.remove("visible");
      name.textContent = "";
      return;
    }

    name.textContent = file.name;
    status.classList.add("visible");
  }

  // حذف فایل انتخاب‌شده
  function removeSelectedFile() {
    const input = document.getElementById("fileInput");
    const status = document.getElementById("fileStatus");
    const name = document.getElementById("fileStatusName");

    if (input) input.value = "";
    if (status) status.classList.remove("visible");
    if (name) name.textContent = "";
  }
</script>

<script src="js/app.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
