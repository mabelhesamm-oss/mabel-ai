
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d18">
  <meta name="description" content="Mabel AI — دستیار هوشمند با هویت اختصاصی">
  <title>چت آنلاین | Mabel AI</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    :root {
      --mabel-purple: #a78bfa;
      --mabel-light: #ddd0ff;
      --mabel-deep: #7c3aed;
      --mabel-glass: rgba(139, 92, 246, .12);
      --mabel-border: rgba(196, 181, 253, .22);
    }

    * {
      box-sizing: border-box;
    }

    body.chat-page {
      min-height: 100vh;
    }

    /* نماد اختصاصی ماه */
    .mabel-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      border-radius: 13px;
      background: linear-gradient(
        145deg,
        rgba(167, 139, 250, .2),
        rgba(124, 58, 237, .06)
      );
      border: 1px solid var(--mabel-border);
      box-shadow: 0 4px 20px rgba(124, 58, 237, .16);
    }

    .mabel-mark svg {
      display: block;
      width: 28px;
      height: 28px;
      overflow: visible;
      filter: drop-shadow(0 2px 7px rgba(139, 92, 246, .45));
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand .brand-name {
      letter-spacing: .3px;
    }

    .chat-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .chat-brand .mabel-mark {
      width: 36px;
      height: 36px;
    }

    .chat-brand-text {
      display: inline-flex;
      flex-direction: column;
      gap: 4px;
    }

    .chat-brand-text small {
      color: var(--mabel-purple);
      font-size: 11px;
      font-weight: 600;
    }

    /* ناحیه چت */
    .chat-layout {
      gap: 18px;
    }

    .chat-side,
    .chatbox {
      border: 1px solid var(--mabel-border);
      background: rgba(24, 17, 40, .62);
      box-shadow:
        0 12px 40px rgba(0, 0, 0, .16),
        inset 0 1px 0 rgba(255, 255, 255, .035);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .chatbox {
      overflow: hidden;
      min-width: 0;
    }

    .chat-head {
      border-bottom: 1px solid rgba(196, 181, 253, .12);
    }

    /* کادر ارسال پیام */
    .composer {
      position: relative;
      border: 1px solid rgba(167, 139, 250, .26);
      background: rgba(16, 13, 28, .76);
      box-shadow: 0 -8px 32px rgba(0, 0, 0, .12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .file-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 0;
    }

    /* دکمه + */
    .add-file-btn {
      width: 46px;
      height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      border-radius: 15px;
      border: 1px solid rgba(167, 139, 250, .48);
      background: linear-gradient(
        145deg,
        rgba(167, 139, 250, .24),
        rgba(124, 58, 237, .10)
      );
      color: var(--mabel-light);
      font-size: 30px;
      font-weight: 400;
      line-height: 1;
      cursor: pointer;
      box-shadow:
        0 0 18px rgba(124, 58, 237, .14),
        inset 0 1px 0 rgba(255, 255, 255, .12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease,
        background .2s ease;
    }

    .add-file-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(196, 181, 253, .8);
      background: rgba(139, 92, 246, .3);
      box-shadow: 0 0 25px rgba(139, 92, 246, .32);
    }

    .add-file-btn:active {
      transform: scale(.94);
    }

    .add-file-btn:focus-visible,
    .send:focus-visible {
      outline: 2px solid var(--mabel-light);
      outline-offset: 3px;
    }

    /* دکمه بررسی فایل */
    .file-check-btn {
      min-height: 44px;
      border: 1px solid rgba(167, 139, 250, .3);
      box-shadow: 0 0 16px rgba(124, 58, 237, .1);
    }

    /* نمایش فایل انتخاب‌شده */
    .file-status {
      display: none;
      align-items: center;
      gap: 10px;
      margin: 0 0 8px;
      padding: 10px 12px;
      border: 1px solid rgba(167, 139, 250, .24);
      border-radius: 12px;
      background: rgba(139, 92, 246, .09);
      color: #d9ccff;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .file-status.visible {
      display: flex;
    }

    .file-status-name {
      min-width: 0;
      flex: 1;
    }

    .remove-file-btn {
      flex: 0 0 auto;
      padding: 3px 8px;
      border: 1px solid rgba(248, 113, 113, .28);
      border-radius: 8px;
      background: rgba(248, 113, 113, .08);
      color: #fca5a5;
      cursor: pointer;
    }

    .remove-file-btn:hover {
      background: rgba(248, 113, 113, .17);
    }

    .composer textarea {
      min-width: 0;
    }

    .hint {
      opacity: .8;
    }

    @media (max-width: 700px) {
      .chat-layout {
        gap: 12px;
      }

      .chat-side {
        min-width: 0;
      }

      .chatbox {
        width: 100%;
      }

      .file-tools {
        gap: 8px;
      }

      .add-file-btn {
        width: 44px;
        height: 44px;
      }
    }

    @media (max-width: 480px) {
      .mabel-mark {
        width: 34px;
        height: 34px;
      }

      .mabel-mark svg {
        width: 25px;
        height: 25px;
      }

      .chat-brand .mabel-mark {
        width: 34px;
        height: 34px;
      }

      .file-check-btn {
        flex: 1;
      }
    }
  </style>
</head>

<body class="chat-page">

<!-- نماد ماه SVG، بدون تصویر خارجی -->
<svg xmlns="http://www.w3.org/2000/svg"
     width="0" height="0"
     aria-hidden="true"
     style="position:absolute;overflow:hidden">
  <symbol id="mabel-moon" viewBox="0 0 100 100">
    <defs>
      <linearGradient id="mabel-moon-gradient"
                      x1="15" y1="10" x2="85" y2="90"
                      gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#e9ddff"/>
        <stop offset="48%" stop-color="#a78bfa"/>
        <stop offset="100%" stop-color="#7c3aed"/>
      </linearGradient>
    </defs>
    <path
      d="M69 11
         C43 10 22 29 22 52
         C22 74 39 90 59 88
         C72 87 83 79 89 66
         C78 73 63 72 52 63
         C39 52 38 34 48 22
         C54 16 61 13 69 11 Z"
      fill="url(#mabel-moon-gradient)"
    />
  </symbol>
</svg>

<header class="nav">
  <a class="brand" href="index.html" aria-label="صفحه خانه Mabel AI">
    <span class="mabel-mark" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <use href="#mabel-moon"/>
      </svg>
    </span>
    <b class="brand-name">Mabel AI</b>
  </a>

  <nav aria-label="منوی اصلی">
    <a href="index.html">خانه</a>
    <a class="active" href="chat.html">چت</a>
    <a href="features.html">امکانات</a>
  </nav>

  <div class="nav-actions">
    <button class="theme"
            type="button"
            onclick="toggleTheme()"
            aria-label="تغییر تم">◐</button>
    <span class="pill">ONLINE AI</span>
  </div>
</header>

<div class="chat-layout">

  <aside class="chat-side">
    <button class="btn full" type="button" onclick="newChat()">
      ＋ گفتگوی جدید
    </button>

    <input
      id="chatSearch"
      class="search"
      type="search"
      placeholder="جست‌وجو..."
      aria-label="جست‌وجوی گفتگوها"
      oninput="renderHistory()"
    >

    <small>گفتگوهای اخیر</small>
    <div id="history"></div>

    <div style="margin-top:20px;padding:12px;background:var(--soft);border-radius:12px;font-size:10px;color:var(--muted);line-height:2">
      🔐 کلید API روی سرور نگه‌داری می‌شود و داخل مرورگر قرار نمی‌گیرد.
    </div>
  </aside>

  <section class="chatbox" aria-label="گفتگوی Mabel AI">

    <div class="chat-head">
      <div class="chat-brand">
        <span class="mabel-mark" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <use href="#mabel-moon"/>
          </svg>
        </span>

        <span class="chat-brand-text">
          <b>Mabel AI</b>
          <small>● آنلاین</small>
        </span>
      </div>

      <button class="ghost" type="button" onclick="clearCurrent()">
        پاک کردن
      </button>
    </div>

    <div class="messages" id="messages" aria-live="polite"></div>

    <div id="typing" class="typing" aria-label="در حال پاسخ‌گویی">
      ● ● ●
    </div>

    <div
      id="fileStatus"
      class="file-status"
      role="status"
      aria-live="polite"
    >
      <span aria-hidden="true">📄</span>
      <span id="fileStatusName" class="file-status-name"></span>
      <button
        id="removeFileButton"
        class="remove-file-btn"
        type="button"
        onclick="removeSelectedFile()"
        aria-label="حذف فایل انتخاب‌شده"
      >حذف ×</button>
    </div>

    <div class="composer">

      <input
        id="fileInput"
        type="file"
        accept=".pdf,.txt,.md,.csv,.json,.js,.html,.css,.py,.ts,.jsx,.tsx,.xml"
        style="display:none"
        onchange="showSelectedFile()"
      >

      <div class="file-tools">
        <button
          type="button"
          class="add-file-btn"
          onclick="document.getElementById('fileInput').click()"
          aria-label="انتخاب فایل"
          title="انتخاب فایل"
        >＋</button>

        <button
          type="button"
          class="btn file-check-btn"
          id="uploadButton"
          onclick="uploadFile()"
        >بررسی فایل ✨</button>
      </div>

      <textarea
        id="input"
        rows="1"
        placeholder="پیامت را بنویس..."
        aria-label="متن پیام"
      ></textarea>

      <button
        class="send"
        id="sendButton"
        type="button"
        onclick="sendMessage()"
        aria-label="ارسال پیام"
      >➤</button>

      <div class="hint">
        Enter برای ارسال • Shift + Enter خط جدید
      </div>
    </div>
  </section>
</div>

<script>
  // نمایش نام فایل انتخاب‌شده
  function showSelectedFile() {
    const input = document.getElementById("fileInput");
    const status = document.getElementById("fileStatus");
    const name = document.getElementById("fileStatusName");

    if (!input || !status || !name) return;

    const file = input.files && input.files[0];

    if (!file) {
      status.classList.remove("visible");
      name.textContent = "";
      return;
    }

    name.textContent = file.name;
    status.classList.add("visible");
  }

  // حذف فایل انتخاب‌شده
  function removeSelectedFile() {
    const input = document.getElementById("fileInput");
    const status = document.getElementById("fileStatus");
    const name = document.getElementById("fileStatusName");

    if (input) input.value = "";
    if (status) status.classList.remove("visible");
    if (name) name.textContent = "";
  }
</script>

<script src="js/app.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
